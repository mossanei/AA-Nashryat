:root{--bg:#eef2f7;--sf:#fff;--tx:#14263d;--mu:#62748a;--pr:#1d4e89;--pr2:#e3ecf7;--rd:#c62828;--rd2:#fdeaea;--gn:#1b7f4b;--bd:#d5dde8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--sf:#17222f;--tx:#e8eef6;--mu:#93a4b8;--pr:#6aa6ea;--pr2:#1c3350;--rd:#ff8a80;--rd2:#3a1c1c;--gn:#5fd196;--bd:#2a3a4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1621;--sf:#17222f;--tx:#e8eef6;--mu:#93a4b8;--pr:#6aa6ea;--pr2:#1c3350;--rd:#ff8a80;--rd2:#3a1c1c;--gn:#5fd196;--bd:#2a3a4d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif;display:flex;flex-direction:column}
header{background:var(--hd,var(--pr));color:var(--hdt,#fff);padding:14px 18px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;font-weight:800;margin:0}
.logo{width:34px;height:34px}
main{flex:1;overflow-y:auto;padding:14px;max-width:720px;width:100%;margin:0 auto}
nav{display:flex;background:var(--sf);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:600 13px Vazirmatn,Tahoma;padding:10px 4px;cursor:pointer}
nav button.on{color:var(--pr);box-shadow:inset 0 3px 0 var(--pr)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rad,10px);padding:12px 14px;margin-bottom:10px}
.card.low{border-color:var(--rd);background:var(--rd2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.t{font-weight:800}.m{color:var(--mu);font-size:13px}
.badge{font-size:12px;font-weight:600;border-radius:99px;padding:1px 10px;background:var(--pr2);color:var(--pr)}
.low .badge{background:var(--rd);color:#fff}
.low .warn{color:var(--rd);font-weight:600;font-size:13px}
button.b{font:600 14px Vazirmatn,Tahoma;border:1px solid var(--pr);background:var(--pr);color:var(--onpr,#fff);border-radius:8px;padding:6px 14px;cursor:pointer}
button.b.o{background:none;color:var(--pr)}
button.b.r{background:var(--rd);border-color:var(--rd);color:#fff}
.btns{display:flex;gap:8px;margin-top:8px}
input,textarea{width:100%;font:400 15px Vazirmatn,Tahoma;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--pr);background:var(--sf);color:var(--pr);font-size:20px;cursor:pointer}
.big{font-size:22px;font-weight:800}
.sum{position:sticky;bottom:0;background:var(--sf);border:1px solid var(--pr);border-radius:10px;padding:12px;margin-top:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}
#sheet{background:var(--sf);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px))}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 4px;border-bottom:1px dashed var(--bd);text-align:right}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
@media print{body>*:not(#modal){display:none}#modal{position:static;background:none;display:block}.btns{display:none}}

.logo *{stroke:var(--hdt,#fff)}
.hb{margin-inline-start:auto;background:none;border:0;font-size:22px;color:var(--hdt,#fff);cursor:pointer}
:root[data-style="brand"]{--bg:#eaf1fb;--sf:#fff;--tx:#14263d;--mu:#5c6f86;--pr:#1f5fae;--pr2:#dce8f8;--rd:#c62828;--rd2:#fdeaea;--gn:#1b7f4b;--bd:#cbd8ea;--hd:#f7b500;--hdt:#1b2a41;--onpr:#fff;--rad:6px;--spbg:linear-gradient(#f7b500 0 20%,#1f5fae 20%);--sptx:#fff;color-scheme:light}
:root[data-style="m3"]{--bg:#f3f5fb;--sf:#fff;--tx:#191c24;--mu:#5d6475;--pr:#3f5fd0;--pr2:#dfe5ff;--rd:#ba1a1a;--rd2:#ffe3e0;--gn:#1d7a4a;--bd:transparent;--hd:#f3f5fb;--hdt:#191c24;--onpr:#fff;--rad:20px;--spbg:#f3f5fb;--sptx:#191c24;color-scheme:light}
:root[data-style="dark"]{--bg:#0b1220;--sf:#141d30;--tx:#eaf0fa;--mu:#8fa0b8;--pr:#f6b81a;--pr2:#2b2a18;--rd:#ff6b6b;--rd2:#3a1a1f;--gn:#4cd08a;--bd:#25324a;--hd:#0b1220;--hdt:#eaf0fa;--onpr:#1b1500;--rad:14px;--spbg:radial-gradient(circle at 50% 30%,#1c2b4a,#0b1220);--sptx:#fff;color-scheme:dark}
[data-style="m3"] header{padding:18px 20px 8px}[data-style="m3"] header h1{font-size:24px}
[data-style="m3"] .card{box-shadow:0 1px 3px rgba(25,28,36,.14)}
[data-style="m3"] nav{border:0;padding:6px 8px}[data-style="m3"] nav button{border-radius:16px}
[data-style="m3"] nav button.on{background:var(--pr2);box-shadow:none}
[data-style="m3"] button.b{border-radius:99px}
[data-style="dark"] header{border-bottom:1px solid var(--bd)}
[data-style="dark"] .card{box-shadow:0 2px 10px rgba(0,0,0,.35)}
#splash{position:fixed;inset:0;z-index:30;background:var(--spbg,var(--bg));color:var(--sptx,var(--tx));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
#splash.hide{display:none}
.cover{position:relative;width:min(62vw,250px);border-radius:var(--rad,10px);overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.cover img{display:block;width:100%;height:auto}
.cover b{position:absolute;inset:auto 0 0 0;padding:28px 10px 12px;text-align:center;color:#fff;font:800 17px/1.6 Vazirmatn,Tahoma;background:linear-gradient(transparent,rgba(10,30,70,.9))}
.styles{display:flex;gap:8px;width:100%;max-width:400px}
.styles button{flex:1;border:2px solid transparent;border-radius:12px;padding:8px 4px;background:rgba(128,128,128,.18);color:inherit;font:600 12px Vazirmatn,Tahoma;cursor:pointer}
.styles button.on{border-color:#f7b500;background:rgba(128,128,128,.32)}
.sw{display:flex;height:16px;border-radius:8px;overflow:hidden;margin-bottom:6px}.sw i{flex:1}
.enter{background:#f7b500;color:#1b2a41;border:0;border-radius:99px;font:800 16px Vazirmatn,Tahoma;padding:10px 44px;cursor:pointer}
.hint{font-size:12px;opacity:.8;margin:0}
.btns{flex-wrap:wrap}
.ibox{background:#fff;color:#14263d;border-radius:10px;padding:14px;margin:10px 0;font-size:14px;line-height:1.9;border:1px solid #cfd8e6}
.ibox td,.ibox th{border-bottom:1px dashed #b9c4d6}
.irow{display:flex;justify-content:space-between;font-size:13px;color:#5c6f86}
.ibl{margin-top:8px;padding:8px;background:#f1f5fb;border-radius:8px}
.itot{font-weight:800;font-size:16px;margin-top:8px;color:#1f5fae}
#toast{position:fixed;bottom:90px;left:16px;right:16px;margin:auto;max-width:420px;background:#14263d;color:#fff;padding:10px 14px;border-radius:10px;text-align:center;z-index:50;display:none;font-size:14px}
.hb2{background:none;border:0;font-size:22px;color:var(--hdt,#fff);cursor:pointer}
.hb.q{width:30px;height:30px;border:2px solid var(--hdt,#fff);border-radius:50%;font:800 17px/1 Vazirmatn,Tahoma;padding:0;margin-inline-end:8px}
details{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:6px 0;background:var(--bg)}summary{font-weight:600;cursor:pointer}details p{margin:6px 0 2px;font-size:14px}
#tour{position:fixed;inset:0;z-index:40;background:rgba(34,54,92,.78);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#tour.show{display:flex}
.tc{width:100%;max-width:420px;background:#1f5fae;color:#fff;border-radius:20px;padding:18px;border:2px solid #f7b500;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.tc .top{display:flex;justify-content:space-between;align-items:center}
.tc .bd{background:#f7b500;color:#1b2a41;border-radius:99px;padding:2px 12px;font-weight:800;font-size:13px}
.tc .x{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:99px;padding:3px 12px;font:600 13px Vazirmatn,Tahoma;cursor:pointer}

<script>
const $=s=>document.querySelector(s);
const fa=n=>Number(n||0).toLocaleString('fa-IR');

const cancelled=e=>e&&(e.name==='AbortError'||/cancel/i.test(String(e.message||e)));
async function nShare(o){const P=CAP&&CAP.Plugins&&CAP.Plugins.Share;if(NATIVE&&P){await P.share(o);return true}return false}
const KEY='aa_publications_v1';
let S=null,tab='books',cart={};
function load(){
  try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
  if(!S){
    S={books:[
      {id:1,name:'کتاب بزرگ',desc:'متن اصلی برنامه انجمن',price:3000000,stock:12,min:5},
      {id:2,name:'دوازده قدم و دوازده سنت',desc:'شرح قدم‌ها و سنت‌ها',price:2000000,stock:4,min:5},
      {id:3,name:'یک روز در یک زمان',desc:'مطالعه روزانه',price:1000000,stock:20,min:8}],
      sales:[],start:0,seq:1,bid:4};
    S.start=S.books.reduce((a,b)=>a+b.stock*b.price,0);
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const low=b=>b.stock<=b.min;
const purchSpent=()=>S.purch.filter(o=>o.status==='received').reduce((a,o)=>a+o.rtotal,0);
const cash=()=>S.sales.reduce((a,s)=>a+s.total,0)-purchSpent();
const inv=()=>S.books.reduce((a,b)=>a+b.stock*b.price,0);
const qs={books:'',sale:'',purchase:''};
const norm=s=>String(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\s]/g,'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).toLowerCase();
const mb=t=>{const x=norm(qs[t]);return S.books.filter(b=>!x||norm(b.name+b.desc).includes(x))};
const sq=t=>`<input id="sq" class="sq" type="search" placeholder="جستجوی نشریه..." value="${esc(qs[t])}" oninput="setQ('${t}',this.value)">`;

function go(t){tab=t;qs[t]='';render()}
const rid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function mig(x){
  if(x.mig2)return;
  const sold={};x.sales.forEach(s=>{s.k=s.k||'old'+s.id;s.id=s.k;s.ts=s.ts||0;s.items.forEach(i=>{i.id=String(i.id);sold[i.id]=(sold[i.id]||0)+i.qty})});
  x.books.forEach(b=>{b.id=String(b.id);b.rs=b.rs||[];b.base=b.stock+(sold[b.id]||0);b.t=b.t||0});
  x.dead=x.dead||{};x.mig2=1;
}
function recalc(){const sold={};S.sales.forEach(s=>s.items.forEach(i=>sold[i.id]=(sold[i.id]||0)+i.qty));
  const got={};S.purch.forEach(o=>o.status==='received'&&o.rec.forEach(i=>got[i.id]=(got[i.id]||0)+i.qty));
  S.books.forEach(b=>b.stock=b.base+b.rs.reduce((a,r)=>a+r.q,0)-(sold[b.id]||0)+(got[b.id]||0))}
function ensure(){S.seller=S.seller||{name:"",phone:"",card:"",sheba:""};S.purch=S.purch||[];S.pseq=S.pseq||1;S.pfx=S.pfx||['الف','ب','پ','ت','ج','چ'][Math.floor(Math.random()*6)];mig(S);recalc()}
let buyer={name:"",phone:""};
function render(){ensure();
  const tabs=[['books','نشریات'],['sale','فروش'],['purchase','خرید'],['invoices','فاکتورها'],['report','گزارش'],['settings','تنظیمات']];
  $('#nav').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${v}${k==='books'&&S.books.some(low)?' ●':''}</button>`).join('');
  $('#ttl').textContent=tabs.find(t=>t[0]===tab)[1];
  $('#main').innerHTML=({books:vBooks,sale:vSale,invoices:vInvoices,report:vReport,settings:vSettings,purchase:vPurchase})[tab]();
}

  try{const f=new File([b],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(cancelled(e))return}
  try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:name,data:b});toast('ذخیره شد. فایل را از پوشه دانلود در پیام‌رسان بفرستید.');return}}catch(e){if(e&&e.code==='declined')return}
  toast('این دستگاه اجازه ارسال یا ذخیره فایل نمی‌دهد.')}

function saveSeller(){
  const card=en($('#s3').value),sh=$('#s4').value.replace(/\s/g,'').toUpperCase(),en2=en;
  if(!$('#s1').value.trim()||!$('#s2').value.trim()){toast('نام و تلفن را وارد کنید.');return}
  if(!/^\d{16}$/.test(card)){toast('شماره کارت باید ۱۶ رقم باشد.');return}
  if(sh&&!/^IR\d{24}$/.test(sh)){toast('شبا باید به شکل IR و ۲۴ رقم باشد.');return}
  S.pfx=$('#s5').value.trim()||S.pfx;S.seller={name:$('#s1').value.trim(),phone:en2($('#s2').value),unit:$('#s6').value.trim(),card,sheba:sh};save();toast('اطلاعات ذخیره شد.')
}

function nextCode(){const t=new Date(),ds=t.getFullYear()+'.'+String(t.getMonth()+1).padStart(2,'0')+'.'+String(t.getDate()).padStart(2,'0');let n=0;
  try{const o=JSON.parse(localStorage.getItem('aa_expcode')||'{}');if(o.d===ds)n=o.n+1;localStorage.setItem('aa_expcode',JSON.stringify({d:ds,n}))}catch(e){}
  let l='',m=n;do{l=String.fromCharCode(65+m%26)+l;m=Math.floor(m/26)-1}while(m>=0);return ds+'-'+l}
function codeCmp(a,b){const[pa,la]=a.split('-'),[pb,lb]=b.split('-');return pa!==pb?(pa<pb?-1:1):la.length!==lb.length?la.length-lb.length:(la<lb?-1:la>lb?1:0)}
function expFile(){{const c=nextCode();toast('کد این فایل: '+c);outFile(new Blob([expStr(c)],{type:'application/json'}),'aa-sync-'+c+'.json','application/json')}}

function doImp(t){
  try{const o=JSON.parse(t),d=o.data;if(o.app!=='aa-pub'||!Array.isArray(d.books)||!Array.isArray(d.sales))throw 0;
    mig(d);pend=d;let note='';pendC=null;
    if(o.code){try{const m=JSON.parse(localStorage.getItem('aa_imp')||'{}'),f=o.from||'?',pv=m[f];pendC=[f,o.code];note=`<p class="m">کد فایل: ${esc(o.code)}</p>`+(pv&&codeCmp(o.code,pv)<=0?`<p style="color:var(--rd)">این فایل قبلاً دریافت شده یا از فایل قبلی (${esc(pv)}) قدیمی‌تر است.</p>`:'')}catch(e){}}
    open(`<h3 style="margin:0">تغییرات دریافتی</h3>${note}<p>${fa(d.sales.length)} فاکتور و ${fa(d.books.length)} کتاب</p><div class="btns"><button class="b" onclick="applyImp(1)">ادغام با اطلاعات من</button><button class="b o" onclick="applyImp(0)">جایگزینی کامل (گوشی جدید)</button><button class="b o" onclick="closeM()">انصراف</button></div><p class="m">برای همگام‌سازی روزمره «ادغام» را بزنید. جایگزینی فقط برای بار اول روی گوشی جدید است.</p>`)}catch(e){toast('فایل یا متن معتبر نیست.')}
}
function applyImp(merge){
  const d=pend;if(!d)return;
  if(merge){
    S.dead={...S.dead,...d.dead};
    const bk=new Map(S.books.map(b=>[b.id,b]));
    d.books.forEach(o=>{const m=bk.get(o.id);if(!m){S.books.push(o);return}
      const rs=new Map(m.rs.map(r=>[r.k,r]));o.rs.forEach(r=>rs.set(r.k,r));m.rs=[...rs.values()];
      if((o.t||0)>(m.t||0))Object.assign(m,{name:o.name,desc:o.desc,price:o.price,min:o.min,base:o.base,t:o.t})});
    S.books=S.books.filter(b=>!S.dead[b.id]);
    const sk=new Set(S.sales.map(s=>s.k));d.sales.forEach(s=>{if(!sk.has(s.k))S.sales.push(s)});
    S.sales.sort((a,b)=>(a.ts||0)-(b.ts||0));
    const pr={pending:0,void:1,received:2},pm=new Map(S.purch.map(o=>[o.k,o]));
    (d.purch||[]).forEach(o=>{const m=pm.get(o.k);if(!m){S.purch.push(o);return}if(pr[o.status]>pr[m.status]||(pr[o.status]===pr[m.status]&&(o.t||0)>(m.t||0)))Object.assign(m,o)});
    if((d.startT||0)>(S.startT||0)){S.start=d.start;S.startT=d.startT}
  }else{const k=S.seller,p=S.pfx,q=S.seq,ps=S.pseq;S=d;S.seller=k;S.pfx=p;S.seq=q||1;S.pseq=ps||1}
  if(pendC)try{const m=JSON.parse(localStorage.getItem('aa_imp')||'{}');if(!m[pendC[0]]||codeCmp(pendC[1],m[pendC[0]])>0)m[pendC[0]]=pendC[1];localStorage.setItem('aa_imp',JSON.stringify(m))}catch(e){}
  pend=null;save();closeM();render();toast(merge?'ادغام انجام شد.':'داده‌ها جایگزین شد.');
}

   +(done.length?`<div class="t" style="margin:14px 0 6px">خریدهای دریافت‌شده</div>`+hist:'');

function issuePO(){
  const items=S.books.filter(b=>pcart[b.id]>0).map(b=>({id:b.id,name:b.name,qty:pcart[b.id],price:b.price}));
  const total=items.reduce((a,i)=>a+i.qty*i.price,0);
  if(!items.length){toast('حداقل یک کتاب انتخاب کنید.');return}
  if(total>cash()){toast('مبلغ درخواست از موجودی نقدی صندوق بیشتر است. فقط تا سقف موجودی صندوق می‌توان خرید ثبت کرد.');return}
  let id=editP;
  if(editP){const o=pget(editP);o.items=items;o.total=total;o.t=Date.now()}
  else{id=rid('p');S.purch.push({k:id,id,no:S.pfx+'-خ'+S.pseq,date:new Date().toLocaleString('fa-IR'),items,total,status:'pending',t:Date.now(),by:S.seller.name});S.pseq++}
  editP=null;pcart={};save();render();showPO(id);
}
function editPO(id){const o=pget(id);editP=id;pcart={};o.items.forEach(i=>pcart[i.id]=i.qty);render();$('#main').scrollTop=9999}
function cancelEdit(){editP=null;pcart={};render()}
function voidPO(id){if(!confirm('این درخواست خرید لغو شود؟'))return;const o=pget(id);o.status='void';o.t=Date.now();save();render()}

  <div class="irow"><span>شماره: ${esc(o.no)}</span><span>${esc(o.date)}</span></div>
  <div class="ibl"><b>درخواست‌کننده (مسئول نشریات):</b> ${esc(o.by||k.name)}<br>تلفن: <span dir="ltr">${esc(k.phone)}</span></div>

function showPO(id){const o=pget(id);open(poHTML(o)+`<div class="btns"><button class="b" onclick="sharePO('${id}')">ارسال متن</button><button class="b" onclick="shareImg('${id}')">عکس</button><button class="b" onclick="sharePdf('${id}')">PDF</button><button class="b o" onclick="closeM()">بستن</button></div>`)}
async function sharePO(id){const o=pget(id),rec=o.status==='received',it=rec?o.rec:o.items;
  const t=`درخواست خرید نشریات انجمن الکلی‌های گمنام${S.seller.unit?' - '+S.seller.unit:''}\nشماره ${o.no} | ${o.date}\nدرخواست‌کننده: ${o.by||''} | ${S.seller.phone}\n`+it.map(i=>`- ${i.name} × ${i.qty}`).join('\n')+`\nجمع: ${rec?o.rtotal:o.total} ریال`;
  try{if(await nShare({text:t,dialogTitle:'ارسال با...'}))return;if(navigator.share){await navigator.share({text:t});return}}catch(e){if(cancelled(e))return}copyText(t,'متن کپی شد.')}
function recvForm(id){const o=pget(id);
  open(`<h3 style="margin:0">دریافت کالا: ${esc(o.no)}</h3><p class="m">تعداد واقعی دریافتی هر کتاب را وارد کنید. کتاب‌هایی که نرسیده را صفر بگذارید.</p>`+o.items.map((i,n)=>`<div class="row" style="margin:6px 0"><span>${esc(i.name)}<br><span class="m">${fa(i.price)} ریال | سفارش ${fa(i.qty)}</span></span><input id="rq${n}" inputmode="numeric" style="width:80px" value="${i.qty}" oninput="recvSum('${id}')"></div>`).join('')+`<div class="row"><b>مبلغ قابل کسر از صندوق</b><b id="rt">${fa(o.total)}</b></div><div class="m">موجودی نقدی: ${fa(cash())} ریال</div><div class="btns"><button class="b" onclick="doRecv('${id}')">تأیید دریافت</button><button class="b o" onclick="closeM()">انصراف</button></div>`)}
function recvItems(o){return o.items.map((i,n)=>({id:i.id,name:i.name,price:i.price,qty:num($('#rq'+n).value)})).filter(i=>i.qty>0)}
function recvSum(id){$('#rt').textContent=fa(recvItems(pget(id)).reduce((a,i)=>a+i.qty*i.price,0))}
function doRecv(id){const o=pget(id),rec=recvItems(o),t=rec.reduce((a,i)=>a+i.qty*i.price,0);
  if(!rec.length){toast('هیچ کتابی دریافت نشده. اگر چیزی نرسیده، درخواست را لغو کنید.');return}
  if(t>cash()){toast('مبلغ کتاب‌های دریافتی از موجودی نقدی صندوق بیشتر است. تعداد را کمتر کنید.');return}
  Object.assign(o,{status:'received',rec,rtotal:t,rdate:new Date().toLocaleString('fa-IR'),t:Date.now()});save();closeM();render();toast('کالا دریافت شد: به موجودی اضافه و از صندوق کم شد.')}

const XT='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function xlsxOut(aoa,name){const wb=XLSX.utils.book_new();aoa.forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));wb.Workbook={Views:[{RTL:true}]};
  outFile(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:XT}),name,XT)}
const noX=()=>{if(window.XLSX)return false;toast('کتابخانه اکسل بارگذاری نشد. اینترنت را بررسی کنید.');return true};
function tplXlsx(){if(noX())return;xlsxOut([['نشریات',[['نام نشریه','شرح','قیمت (ریال)','موجودی','حداقل موجودی'],['کتاب بزرگ','متن اصلی برنامه',3000000,10,5],['نمونه دوم','',1000000,20,8]]]],'aa-template.xlsx')}
let pendX=null;
function impXlsx(i){const f=i.files[0];i.value='';if(!f||noX())return;const r=new FileReader();
  r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'}),a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),hd=a[0].map(String),ix=k=>hd.findIndex(x=>x.includes(k));
    const c={n:ix('نام'),d:ix('شرح'),p:ix('قیمت'),m:ix('حداقل'),s:hd.findIndex(x=>x.includes('موجودی')&&!x.includes('حداقل'))},g=(x,k,d)=>x[c[k]<0?d:c[k]];
    const rows=a.slice(1).map(x=>({name:String(g(x,'n',0)).trim(),desc:String(g(x,'d',1)||'').trim(),price:num(g(x,'p',2)),stock:num(g(x,'s',3)),min:num(g(x,'m',4))})).filter(x=>x.name);
    if(!rows.length)throw 0;pendX=rows;
    open(`<h3 style="margin:0">فهرست اکسل</h3><p>${fa(rows.length)} نشریه پیدا شد.</p><div class="btns"><button class="b" onclick="applyX()">افزودن و به‌روزرسانی</button><button class="b o" onclick="closeM()">انصراف</button></div><p class="m">نشریه‌ای که نامش در برنامه هست، قیمت، حداقل و موجودی‌اش مطابق فایل تغییر می‌کند.</p>`)}catch(e){toast('فایل اکسل معتبر نیست.')}};
  r.readAsArrayBuffer(f)}
function applyX(){let a=0,u=0;pendX.forEach(r=>{const b=S.books.find(x=>norm(x.name)===norm(r.name));
  if(b){if(r.desc)b.desc=r.desc;Object.assign(b,{price:r.price,min:r.min,base:b.base+r.stock-b.stock,t:Date.now()});u++}
  else{S.books.push({id:rid('b'),name:r.name,desc:r.desc,price:r.price,stock:r.stock,min:r.min,base:r.stock,rs:[],t:Date.now()});a++}});
  pendX=null;recalc();save();closeM();render();toast(fa(a)+' نشریه جدید و '+fa(u)+' به‌روزرسانی')}
let rp={from:'',to:''};
const jk=s=>{const m=String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/-/g,'/').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})(?!\d)/);return m?+m[1]*10000+ +m[2]*100+ +m[3]:0};
const jtoday=()=>new Date().toLocaleDateString('fa-IR-u-nu-latn');
function rpSet(k){const t=jtoday().split('/');if(k==='all')rp={from:'',to:''};else if(k==='today')rp={from:t.join('/'),to:t.join('/')};else rp={from:t[0]+'/'+t[1]+'/1',to:t.join('/')};render()}
function rptData(){const f=jk(rp.from),t=jk(rp.to),ok=k=>(!f||k>=f)&&(!t||k<=t);
  const ss=S.sales.filter(s=>ok(jk(s.date))),pp=S.purch.filter(o=>o.status==='received'&&ok(jk(o.rdate)));
  const by={};ss.forEach(s=>s.items.forEach(i=>{const e=by[i.name]=by[i.name]||{q:0,v:0};e.q+=i.qty;e.v+=i.qty*i.price}));
  return{ss,pp,by,st:ss.reduce((a,s)=>a+s.total,0),pt:pp.reduce((a,o)=>a+o.rtotal,0)}}
function rptCard(){const r=rptData();
  return `<div class="card"><div class="t">گزارش بازه زمانی</div><div class="m">تاریخ شمسی را مثل 1405/08/01 بنویسید. خالی یعنی بدون محدودیت.</div>
  <div class="row" style="gap:8px"><div style="flex:1"><label>از تاریخ</label><input dir="ltr" value="${esc(rp.from)}" oninput="rp.from=this.value"></div><div style="flex:1"><label>تا تاریخ</label><input dir="ltr" value="${esc(rp.to)}" oninput="rp.to=this.value"></div></div>
  <div class="btns"><button class="b" onclick="render()">نمایش</button><button class="b o" onclick="rpSet('today')">امروز</button><button class="b o" onclick="rpSet('month')">این ماه</button><button class="b o" onclick="rpSet('all')">همه</button></div>
  <div class="row" style="margin-top:8px"><span>تعداد فاکتور</span><b>${fa(r.ss.length)}</b></div><div class="row"><span>جمع فروش</span><b>${fa(r.st)} ریال</b></div><div class="row"><span>جمع خریدهای دریافت‌شده</span><b>${fa(r.pt)} ریال</b></div>
  ${Object.keys(r.by).length?'<table><tr><th>نشریه</th><th>تعداد</th><th>مبلغ</th></tr>'+Object.entries(r.by).map(([n,e])=>`<tr><td>${esc(n)}</td><td>${fa(e.q)}</td><td>${fa(e.v)}</td></tr>`).join('')+'</table>':''}
  <div class="btns"><button class="b" onclick="expXlsx()">خروجی اکسل</button></div></div>`}
function expXlsx(){if(noX())return;const r=rptData();
  const sl=[['شماره','تاریخ','خریدار','تلفن','عنوان','تعداد','قیمت','جمع']],pl=[['شماره','تاریخ دریافت','عنوان','تعداد','قیمت','جمع']],bl=[['نشریه','قیمت','موجودی','ارزش','حداقل موجودی']];
  r.ss.forEach(s=>s.items.forEach(i=>sl.push([s.no,s.date,(s.buyer||{}).name,(s.buyer||{}).phone,i.name,i.qty,i.price,i.qty*i.price])));
  r.pp.forEach(o=>o.rec.forEach(i=>pl.push([o.no,o.rdate,i.name,i.qty,i.price,i.qty*i.price])));
  S.books.forEach(b=>bl.push([b.name,b.price,b.stock,b.stock*b.price,b.min]));
  xlsxOut([['خلاصه',[['گزارش نشریات انجمن الکلی‌های گمنام'],['از تاریخ',rp.from||'ابتدا'],['تا تاریخ',rp.to||'امروز'],[],['تعداد فاکتور',r.ss.length],['جمع فروش (ریال)',r.st],['تعداد خرید دریافت‌شده',r.pp.length],['جمع خرید (ریال)',r.pt],['موجودی صندوق فعلی (ریال)',cash()],['ارزش انبار فعلی (ریال)',inv()],['تنخواه اولیه (ریال)',S.start]]],['فروش‌ها',sl],['خریدها',pl],['موجودی',bl]],'aa-report-'+(rp.from||'start').replace(/\//g,'-')+'_'+(rp.to||'now').replace(/\//g,'-')+'.xlsx')}

let ti=0,tab0='books',tx0=null;
function startTour(){tab0=tab;ti=0;closeM();$('#tour').classList.add('show');drawTour()}
function endTour(){$('#tour').classList.remove('show');try{localStorage.setItem('aa_tour','1')}catch(e){}tab=tab0;render()}
function tourGo(d){const n=ti+d;if(n<0)return;if(n>=TS.length){endTour();return}ti=n;drawTour()}
function drawTour(){const s=TS[ti];if(s.tab&&tab!==s.tab){tab=s.tab;render()}
  $('#tc').innerHTML=`<div class="top"><span class="bd">مرحله ${fa(ti+1)} از ${fa(TS.length)}</span><button class="x" onclick="endTour()">خروج ✕</button></div><div class="tt">${s.t}</div><p>${s.x}</p><div class="dots">${TS.map((_,i)=>`<i class="${i===ti?'on':''}"></i>`).join('')}</div><div class="tn"><button class="pv" onclick="tourGo(-1)" ${ti?'':'disabled style="opacity:.35"'}>قبلی</button><button class="nx" onclick="tourGo(1)">${ti===TS.length-1?'پایان':'بعدی'}</button></div>`}
$('#tour').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});
$('#tour').addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)tourGo(dx<0?1:-1)});
document.addEventListener('keydown',e=>{if(!$('#tour').classList.contains('show'))return;if(e.key==='ArrowLeft')tourGo(1);if(e.key==='ArrowRight')tourGo(-1);if(e.key==='Escape')endTour()});
const PH={books:'فهرست نشریات و موجودی آن‌هاست. کارت قرمز یعنی موجودی به حداقل رسیده. «شارژ انبار» فقط تعداد را بالا می‌برد و از صندوق چیزی کم نمی‌کند. برای خرید رسمی از بخش «خرید» استفاده کنید.',
sale:'نام و تلفن خریدار الزامی است. نشریه‌ها را انتخاب کنید و فاکتور صادر کنید. تعداد بیشتر از موجودی قابل انتخاب نیست.',
purchase:'درخواست خرید بسازید، تا قبل از دریافت اصلاحش کنید و بعد «دریافت کالا» بزنید. مبلغ دریافتی از صندوق کم می‌شود و نمی‌تواند از موجودی صندوق بیشتر باشد.',
invoices:'فهرست فاکتورهای صادرشده. روی هر کدام بزنید تا ببینید و دوباره بفرستید.',
report:'وضعیت صندوق و انبار، گزارش بازه زمانی و خروجی اکسل.',
settings:'اطلاعات فروشنده، ورود فهرست نشریات از اکسل، و همگام‌سازی با بازو.'};
const HT=[['اولین بار چه کنم؟','۱) در «تنظیمات» اطلاعات خودتان را ثبت کنید. ۲) نشریات را وارد کنید (دستی یا با اکسل). ۳) تنخواه اولیه را در «گزارش» بررسی کنید. حالا آماده فروش هستید.'],
['ثبت یک فروش','در تب «فروش» نام و تلفن خریدار را بنویسید، نشریه‌ها را انتخاب کنید و «صدور فاکتور» را بزنید.'],
['ارسال فاکتور به خریدار','در فاکتور، «ارسال متن» را بزنید تا شماره کارت قابل کپی باشد. «عکس» و «PDF» هم هست. هر پیام‌رسان یا ایمیلی را از فهرست انتخاب کنید.'],
['سفارش و دریافت نشریات','در تب «خرید» درخواست بسازید. بعد از رسیدن کتاب‌ها «دریافت کالا» را بزنید و تعداد واقعی را بنویسید. مبلغ از صندوق کم و موجودی زیاد می‌شود.'],
['گزارش و اکسل','در تب «گزارش»، تاریخ شروع و پایان را بنویسید (مثل 1405/08/01) و «نمایش» را بزنید. «خروجی اکسل» فایل کامل می‌سازد.'],
['همگام‌سازی با بازو','«ارسال تغییرات» را بزنید و فایل را بفرستید. گیرنده با «ادغام» آن را دریافت می‌کند. هر فایل کدی دارد (مثل 2026.11.22-A) تا فایل قدیمی را دوباره دریافت نکنید.'],
['پشتیبان‌گیری','اطلاعات فقط روی همین گوشی است. هر چند وقت «ارسال تغییرات» را بزنید و فایل را نزد خودتان نگه دارید.']];
const HQ=[['اگر برنامه را حذف کنم چه می‌شود؟','همه اطلاعات از بین می‌رود. قبلاً «ارسال تغییرات» را بزنید و فایل را نگه دارید.'],
['موجودی منفی شد، یعنی چه؟','یعنی بعد از ادغام، از یک نشریه بیشتر از موجودی فروخته شده. موجودی واقعی را شمارش و با «ویرایش» اصلاح کنید.'],
['چرا نمی‌توانم خرید ثبت کنم؟','مبلغ از موجودی نقدی صندوق بیشتر است.'],
['فایل ارسال نشد.','از «ارسال به‌صورت متن» استفاده کنید.']];
function showHelp(){const d=a=>a.map(([q,t])=>`<details><summary>${q}</summary><p>${t}</p></details>`).join('');
  open(`<h3 style="margin:0 0 10px">راهنما</h3><button class="b" style="width:100%" onclick="startTour()">شروع آموزش مرحله‌ای</button><div class="card" style="margin-top:10px"><div class="t">راهنمای این صفحه</div><div>${PH[tab]}</div></div><div class="t">موضوعات</div>${d(HT)}<div class="t" style="margin-top:10px">سؤال‌های رایج</div>${d(HQ)}<div class="btns"><button class="b o" onclick="closeM()">بستن</button></div>`)}
function editBook(id){
  const b=S.books.find(x=>x.id===id)||{name:'',desc:'',price:'',stock:0,min:0};
  open(`<h3 style="margin:0">${id?'ویرایش کتاب':'کتاب جدید'}</h3>
  <label>نام کتاب</label><input id="f1" value="${esc(b.name)}">
  <label>شرح</label><textarea id="f2" rows="2">${esc(b.desc)}</textarea>
  <label>قیمت (ریال)</label><input id="f3" inputmode="numeric" value="${b.price}">
  <label>موجودی</label><input id="f4" inputmode="numeric" value="${b.stock}">
  <label>حداقل موجودی (نقطه سفارش)</label><input id="f5" inputmode="numeric" value="${b.min}">
  <div class="btns"><button class="b" onclick="saveBook('${id}')">ذخیره</button><button class="b o" onclick="closeM()">انصراف</button>${id?`<button class="b r" onclick="delBook('${id}')">حذف</button>`:''}</div>`);
}
function saveBook(id){if(id==='0')id=0;
  const n=$('#f1').value.trim();if(!n){$('#f1').focus();return}
  const d={name:n,desc:$('#f2').value.trim(),price:num($('#f3').value),stock:num($('#f4').value),min:num($('#f5').value)};
  if(id){const b=S.books.find(x=>x.id===id);b.base=d.stock-(b.stock-b.base);delete d.stock;Object.assign(b,d,{t:Date.now()})}else S.books.push({id:rid('b'),...d,base:d.stock,rs:[],t:Date.now()});
  save();closeM();render();
}
function delBook(id){if(!confirm('این کتاب حذف شود؟'))return;S.dead[id]=Date.now();S.books=S.books.filter(x=>x.id!==id);delete cart[id];save();closeM();render()}
function restock(id){
  const b=S.books.find(x=>x.id===id);
  open(`<h3 style="margin:0">شارژ انبار: ${esc(b.name)}</h3><div class="m">موجودی فعلی: ${fa(b.stock)}</div>
  <label>تعداد دریافتی</label><input id="f1" inputmode="numeric" value="">
  <div class="btns"><button class="b" onclick="doRestock('${id}')">افزودن به انبار</button><button class="b o" onclick="closeM()">انصراف</button></div>`);
}
function doRestock(id){const n=num($('#f1').value);if(!n){$('#f1').focus();return}S.books.find(x=>x.id===id).rs.push({k:rid('r'),q:n,t:Date.now()});save();closeM();render()}
function editStart(){
  open(`<h3 style="margin:0">تنخواه اولیه</h3><label>مبلغ (ریال)</label><input id="f1" inputmode="numeric" value="${S.start}">
  <div class="btns"><button class="b" onclick="S.start=num($('#f1').value);S.startT=Date.now();save();closeM();render()">ذخیره</button><button class="b o" onclick="closeM()">انصراف</button></div>`);
}
function resetAll(){if(!confirm('همه کتاب‌ها و فاکتورها پاک شود؟'))return;S={books:[],sales:[],start:0,seq:1,bid:1,seller:S.seller};cart={};save();render()}
function open(h){$('#sheet').innerHTML=h;$('#modal').classList.add('show')}
function closeM(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
const STYLES=[['brand','هویت انجمن','#1f5fae','#f7b500','#fff'],['m3','مدرن و نرم','#3f5fd0','#dfe5ff','#f3f5fb'],['dark','شب','#f6b81a','#141d30','#0b1220']];
let style='brand';try{style=localStorage.getItem('aa_style')||'brand'}catch(e){}
function setStyle(k){style=k;document.documentElement.dataset.style=k;try{localStorage.setItem('aa_style',k)}catch(e){}drawStyles()}
function drawStyles(){if(!$('#styles'))return;$('#styles').innerHTML=STYLES.map(s=>`<button class="${s[0]===style?'on':''}" onclick="setStyle('${s[0]}')"><div class="sw"><i style="background:${s[2]}"></i><i style="background:${s[3]}"></i><i style="background:${s[4]}"></i></div>${s[1]}</button>`).join('')}
function showTheme(){open('<h3 style="margin:0 0 10px">تم برنامه</h3><div class="styles" id="styles"></div><div class="btns"><button class="b" onclick="closeM()">تأیید</button></div>');drawStyles()}
function hideSplash(){$('#splash').classList.add('hide');let s=0;try{s=localStorage.getItem('aa_tour')}catch(e){}if(!s)startTour()}
document.documentElement.dataset.style=style;drawStyles();
load();render();
</script>
</body>
</html>
